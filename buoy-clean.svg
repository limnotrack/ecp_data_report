<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 82" width="64" height="82">
  <defs>
    <!-- fade reflection with depth -->
    <linearGradient id="reflFade" gradientUnits="userSpaceOnUse" x1="0" y1="47" x2="0" y2="78">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="82">
      <rect x="0" y="0" width="64" height="82" fill="url(#reflFade)"/>
    </mask>
    <!-- only render reflection below the water surface -->
    <clipPath id="below">
      <path d="M0,43.6 C13,43 20,45.2 27,46.7 C34,48.2 49,49.4 64,48.8 L64,82 L0,82 Z"/>
    </clipPath>
  </defs>

  <!-- ===== reflection: true mirror across the tilted water plane (12°) through the contact point, vertically compressed 0.82 for ripple foreshortening ===== -->
  <g clip-path="url(#below)" mask="url(#fade)" opacity="0.38"
     transform="translate(27,46.7) rotate(12) scale(1,-0.82) rotate(-12) translate(-27,-46.7)">
    <g transform="rotate(12,27,46.7)">
      <rect x="23.75" y="6" width="6.5" height="5.5" rx="1.2" fill="#EFC98C"/>
      <rect x="25" y="10" width="4" height="22" rx="1.2" fill="#EFC98C"/>
      <path d="M16.5,45 L19.5,34.5 L23.5,31 L30.5,31 L34.5,34.5 L37.5,45 Z" fill="#F0941E"/>
      <rect x="15.5" y="45" width="23" height="3.5" rx="1" fill="#EFC98C"/>
    </g>
  </g>

  <!-- ===== buoy, axis normal to local wave tangent (surface slope ~12° at contact) ===== -->
  <g transform="rotate(12,27,46.7)">
    <!-- keel (submerged) -->
    <path d="M21,48.5 L23,58 L31,58 L33,48.5 Z" fill="#EFC98C" opacity="0.55"/>
    <!-- flotation collar at waterline -->
    <rect x="15.5" y="45" width="23" height="3.5" rx="1" fill="#EFC98C"/>
    <!-- body -->
    <path d="M16.5,45 L19.5,34.5 L23.5,31 L30.5,31 L34.5,34.5 L37.5,45 Z" fill="#F0941E"/>
    <!-- mast -->
    <rect x="25" y="10" width="4" height="22" rx="1.2" fill="#EFC98C"/>
    <!-- mast head -->
    <rect x="23.75" y="6" width="6.5" height="5.5" rx="1.2" fill="#EFC98C"/>
  </g>

  <!-- ===== water surface ===== -->
  <path d="M1,43.5 C13,43 20,45.2 27,46.7 C34,48.2 49,49.4 63,48.8"
        stroke="#6FA8D6" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M6,53 C16,51.8 24,53.6 33,54.6 C42,55.6 52,55.2 59,54.4"
        stroke="#6FA8D6" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.35"/>

  <!-- ripple breaks across the reflection -->
  <path d="M20,58.5 h9 M31,64 h7" stroke="#6FA8D6" stroke-width="1.2" stroke-linecap="round" opacity="0.3"/>
</svg>
